    <!-- Google tag (gtag.js) -->
    <!-- Canonical host fallback (Sept 25 2026). Search Console showed
         www.realpropertyplanning.com indexed as a separate site, splitting
         every page's signal. The real fix is a 301 at the host (Lovable
         domain settings: bare domain primary); this forwards a www visitor
         to the same path on the bare host if that redirect is ever missing.
         Runs before anything else so no analytics hit is recorded on www. -->
    <script>
      if (location.hostname === "www.realpropertyplanning.com") {
        location.replace("https://realpropertyplanning.com" + location.pathname + location.search + location.hash);
      }
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0X2GPKCW65"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-0X2GPKCW65');
    </script>
    <meta name="google-site-verification" content="WqzgPFUggfXVdfdb1HYv-dQdznpmIejwblRWHLJGvRc" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Real Property Planning" />

    <!-- FAVICON. There were no icon links here at all, so the browser fell
         back to its default guess of /favicon.ico — which was still the old
         silver-swoosh roof mark. Declaring them explicitly means the file that
         ships is the file that renders.

         The ?v=2 is not decoration. Favicons are cached harder than almost
         anything else a browser holds; replacing favicon.ico at the same URL
         can leave the old mark showing for days. The query string makes it a
         new URL. Bump it to v=3 next time the icon changes. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />

    <!-- Manifest supplies the name Chrome uses for shortcut tiles and home
         screen icons. Without it Chrome guesses from the page title and was
         landing on "Washington State", with the brand nowhere in it.
         short_name in the manifest is what it uses instead.

         NOTE: never write an HTML tag name in angle brackets inside a comment
         in this file. Doing exactly that here took the whole site down on
         2026-08-15: the minifier mangled the comment, consumed its closing
         delimiter, and the browser then swallowed the rest of the document —
         script, stylesheet and root div included — as comment text. Blank
         page, empty console, nothing to debug. Describe tags in words. -->
    <link rel="manifest" href="/site.webmanifest?v=2" />

    <!-- ONE family, DM Sans, served from this site (Oct 6, 2026).

         It used to load from Google Fonts: two render-blocking stylesheets on
         another domain (DM Sans, plus Courier Prime, which nothing used after
         the Sept 2026 tagline change), costing a phone roughly 0.75s before
         the first paint. The files in public/fonts/ are the same variable font
         (weight 100-1000 and optical size, as Google served it) from
         @fontsource-variable/dm-sans 5.3.0, under the SIL Open Font License
         (public/fonts/DM-Sans-OFL.txt). Latin is preloaded; latin-ext and
         italics load only when a page uses them. If the files are ever
         replaced, give them a new -vN name: they are cached for a year.

         Token and font load must agree: tailwind.config.ts and index.css name
         'DM Sans', which is the family declared here. -->
    <link rel="preload" href="/fonts/dm-sans-latin-opsz-normal-v5.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 100 1000; font-display: swap; src: url(/fonts/dm-sans-latin-opsz-normal-v5.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }

      @font-face { font-family: 'DM Sans'; font-style: italic; font-weight: 100 1000; font-display: swap; src: url(/fonts/dm-sans-latin-ext-opsz-italic-v5.woff2) format('woff2'); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
